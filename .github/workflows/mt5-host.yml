name: MT5 Host Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mt5-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libsqlite3-dev libssl-dev
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run MT5 host and distribution checks
        run: python tools/leverage_suite.py --scope all --artifact tools/.artifacts/mt5-host.json
      - name: Preserve receipt and per-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mt5-host-${{ github.sha }}
          path: |
            tools/.artifacts/mt5-host.json
            tools/.artifacts/mt5-host.logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
