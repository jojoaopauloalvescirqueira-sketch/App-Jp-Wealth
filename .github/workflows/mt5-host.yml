name: MT5 Host Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hedge_diagnostic:
        description: Run additional Hedge diagnostics; full Quality Gate remains required
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mt5-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mt5-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libsqlite3-dev libssl-dev
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build source archive declared by the manifest
        run: python tools/build_leverage_package.py
      - name: Run MT5 host and distribution checks
        run: python tools/leverage_suite.py --scope all --artifact tools/.artifacts/mt5-host.json
      - name: Preserve receipt and per-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mt5-host-${{ github.sha }}
          path: |
            tools/.artifacts/mt5-host.json
            tools/.artifacts/mt5-host.logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  hedge-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.hedge_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned browser runtime
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Collect Hedge diagnostics using the existing checker
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export JP_WEALTH_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          "$JP_WEALTH_CHROMIUM" --version
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" python - <<'PY_HEDGE_DIAGNOSTIC'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          import quality_gate as gate
          out=Path("tools/.artifacts/hedge-diagnostic")
          out.mkdir(parents=True, exist_ok=True)
          report={"scope":"Hedge diagnostic only; not a full quality gate", "head":os.environ["GITHUB_SHA"],
                  "gateSha256":hashlib.sha256(Path("tools/quality_gate.py").read_bytes()).hexdigest(),
                  "checks":[], "complete":False, "runningCheck":None, "fullGateRequired":True}
          def persist():
              temporary=out/"diagnostic-checks.json.tmp"
              temporary.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
              temporary.replace(out/"diagnostic-checks.json")
          persist()
          for name,command in [
              ("hedge-prop-engine", ["node", "tools/hedge_prop_engine_test.js"]),
              ("hedge-prop-browser", [sys.executable, "tools/hedge_prop_browser_test.py", "--native-zoom", "--out", str(out)])
          ]:
              report["runningCheck"]=name
              persist()
              try:
                  check=gate.run_check(name, command)
              except BaseException as error:
                  report["interruption"]={"type":type(error).__name__, "detail":str(error)}
                  persist()
                  raise
              report["checks"].append(check)
              report["runningCheck"]=None
              persist()
              print(json.dumps(check,ensure_ascii=False,indent=2),flush=True)
          report["complete"]=True
          persist()
          print(json.dumps(report,ensure_ascii=False,indent=2),flush=True)
          raise SystemExit(0 if all(c["result"]=="PASS" for c in report["checks"]) else 1)
          PY_HEDGE_DIAGNOSTIC
      - name: Preserve focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hedge-diagnostic-${{ github.sha }}
          path: tools/.artifacts/hedge-diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
