name: Quality Gate

on:
  # Gatilho principal deste projeto. O fluxo real e trabalhar em branch,
  # mesclar LOCALMENTE e publicar main — nao ha passagem por pull request,
  # entao sem este gatilho o gate so rodaria por acionamento manual.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Quality tier
        required: true
        default: standard
        type: choice
        options:
          - standard
          - full

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Sem isto o runner recebe um clone RASO (o padrao da action e
          # fetch-depth: 1, so o commit do evento). Duas suites servem builds
          # historicos por `git archive` de SHAs pinados — alladin_foundation
          # (F, F2) e session_epoch_protocol (E6, E15) — e num clone raso esses
          # objetos simplesmente nao existem. O efeito nao e teorico: E6/E15
          # reprovavam o gate inteiro e F/F2 eram pulados em silencio, contados
          # como PASS. Historico completo e o que torna essas quatro provas
          # executaveis no Linux do CI.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          # Sem isto o passo ABORTA: o cache do setup-python procura
          # requirements.txt ou pyproject.toml, e este repositorio nao tem
          # nenhum dos dois — a unica lista e requirements-dev.txt.
          cache-dependency-path: requirements-dev.txt

      - name: Install test runtime
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run quality gate
        env:
          QUALITY_TIER: ${{ inputs.tier || 'standard' }}
        run: python tools/quality_gate.py --tier "$QUALITY_TIER"

      - name: Explain failed session finalization
        if: failure()
        env:
          QUALITY_TIER: ${{ inputs.tier || 'standard' }}
        run: |
          python - <<'PY_DIAGNOSTIC'
          import json
          import os
          from pathlib import Path

          def emit(value):
              for line in str(value).splitlines():
                  print('| ' + line, flush=True)

          matches = []
          for path in sorted(Path('tools/.artifacts').glob('quality-*.json')):
              report = json.loads(path.read_text(encoding='utf-8'))
              if (report.get('tier') == os.environ['QUALITY_TIER']
                      and report.get('git', {}).get('head') == os.environ['GITHUB_SHA']):
                  matches.append((path, report))
          if len(matches) != 1:
              emit('DIAGNOSTIC_UNAVAILABLE: expected one report for this tier and SHA; found ' + str(len(matches)))
              raise SystemExit(1)
          path, report = matches[0]
          emit(json.dumps({'report': str(path), 'tier': report['tier'],
                           'head': report['git']['head'], 'summary': report['summary']}))
          checks = [check for check in report['checks'] if check['name'] == 'session-finalization']
          if len(checks) != 1:
              emit('DIAGNOSTIC_UNAVAILABLE: session-finalization not uniquely recorded')
              raise SystemExit(1)
          check = checks[0]
          emit(json.dumps({key: check[key] for key in
                           ('name', 'result', 'returncode', 'duration_seconds')}))
          if check['result'] != 'PASS':
              emit(check['output_tail'][-12000:])
          PY_DIAGNOSTIC
