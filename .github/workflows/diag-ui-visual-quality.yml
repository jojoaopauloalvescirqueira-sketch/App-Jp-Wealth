name: Diagnóstico temporário — ui-visual-quality no Linux

# Diagnóstico temporário autorizado em 24/10/2026, somente na branch
# claude/diag-ui-visual-ci-20261024. Não entra no main e não altera o
# Quality Gate. Roda só tools/ui_visual_quality_test.py no mesmo runner e
# com a mesma instalação do Quality Gate, sem o limite de 900 s por
# verificação, e publica a saída integral para identificar casos que falham.

on:
  push:
    branches: [claude/diag-ui-visual-ci-20261024]

permissions:
  contents: read

jobs:
  ui-visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test runtime
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run ui-visual-quality without the 900 s gate limit
        run: |
          set +e
          mkdir -p diag
          start=$(date +%s)
          python tools/ui_visual_quality_test.py --out diag/out 2>&1 | tee diag/run.log
          rc=${PIPESTATUS[0]}
          echo "exit=$rc seconds=$(( $(date +%s) - start ))" | tee diag/summary.txt
          exit "$rc"
        continue-on-error: true

      - name: Summarize non-PASS cases
        if: always()
        run: |
          echo "Linhas que não são PASS:"
          grep -v -E '^PASS ' diag/run.log | tail -n 200 || true
          cat diag/summary.txt || true

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diag-ui-visual-quality-${{ github.sha }}
          path: diag/
          retention-days: 7
