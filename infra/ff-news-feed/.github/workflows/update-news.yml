# Atualiza ff-high-impact.json a cada 30 minutos com o calendário de alto
# impacto do Forex Factory (filtrado em scripts/fetch_news.py). Só commita
# quando o conteúdo realmente mudou — semanas quietas não geram ruído.
#
# Nota: o GitHub pausa agendamentos após ~60 dias sem atividade no repositório;
# se o widget mostrar dado velho, entre em Actions e clique "Run workflow".
name: Atualizar notícias de alto impacto

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar e filtrar o feed
        run: python3 scripts/fetch_news.py

      - name: Commitar somente se houve mudança
        run: |
          if git diff --quiet -- ff-high-impact.json; then
            echo "sem mudanças — nada a commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff-high-impact.json
          git commit -m "chore: atualizar notícias de alto impacto"
          git push
