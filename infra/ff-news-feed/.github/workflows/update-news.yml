# TEMPLATE LOCAL para o repositório público de dados, sem ativação nesta entrega.
# O job exige habilitação externa explícita após revisão da permissão e do deploy.
name: Atualizar calendário econômico público

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    if: vars.JPW_ECONOMIC_FEED_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capturar uma vez e derivar os dois recortes
        run: python3 scripts/fetch_news.py --fetch-ff

      - name: Publicar somente dados validados após habilitação
        run: |
          if git diff --quiet -- ff-high-impact.json economic-calendar.json data/snapshots; then
            echo "sem mudanças — nada a commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff-high-impact.json economic-calendar.json data/snapshots
          git commit -m "chore: atualizar calendário econômico público"
          git push
